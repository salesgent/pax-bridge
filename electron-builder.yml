appId: com.salesgent.paxbridge
productName: Salesgent Hardware Bridge
copyright: Copyright © Salesgent

directories:
  buildResources: build
  output: release

# App code inside the asar. Bridge ships separately as an unpacked resource
# because it runs as its own Node process via utilityProcess.
files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!**/{test,tests,docs,__tests__}/**"
  - "!**/*.{md,markdown,ts,map}"

# Embedded PAX bridge (Express + production deps). Filters keep only runtime
# files — serialport prebuilds for other OSes are stripped in afterPack.
extraResources:
  - from: bridge
    to: bridge
    filter:
      - "**/*"
      - "!**/.env"
      - "!**/data/**"
      - "!**/*.{md,markdown,map,ts}"
      - "!**/test/**"
      - "!**/tests/**"
      - "!**/__tests__/**"
      - "!**/docs/**"
      - "!**/example/**"
      - "!**/examples/**"
      - "!**/node_modules/@serialport/bindings-cpp/{src,binding.gyp,LICENSE,README.md}"
      - "!**/node_modules/node-addon-api/**"
      - "!**/node_modules/**/{CHANGELOG*,HISTORY*,README*,LICENSE*,LICENCE*,.npmignore,.eslintrc*,.prettierrc*}"

asar: true

# English only — Chromium ships ~55 locale packs (~25–30 MB).
electronLanguages:
  - en-US
  - en

# Trims unused Electron/runtime files + wrong-OS native prebuilds.
# Ad-hoc re-sign only when no Developer ID cert is present; CI uses CSC_LINK.
afterPack: build/after-pack.js

# Default is electron-builder's "normal" (= 7z -mx=9 for NSIS). CI builds
# Windows on macOS (avoids Windows-runner 7za hang + Linux wine) and sets
# ELECTRON_BUILDER_COMPRESSION_LEVEL=1 → ~80 MB setup.exe. Local scripts
# use the same env.

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.point-of-sale
  icon: build/icon.icns
  # Stable names (no ${version}) so /releases/latest/download/... links keep working.
  artifactName: "PAX-Bridge-mac-${arch}.${ext}"
  # Developer ID signing + notarization (CI provides CSC_* + APPLE_* secrets).
  # Without secrets, electron-builder skips signing; afterPack ad-hoc signs instead.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true

dmg:
  # ${arch} required: arm64 + x64 dmg builds run in parallel and must not share
  # the same hdiutil volume name.
  title: "Salesgent Hardware Bridge ${version} ${arch}"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: "PAX-Bridge-Setup.${ext}"
  # Must be false for Linux cross-compile: "sign" still pulls winCodeSign + wine
  # even when CSC_IDENTITY_AUTO_DISCOVERY=false. asar integrity is already
  # patched earlier via pure-JS resedit (see pack log).
  signAndEditExecutable: false
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Salesgent Hardware Bridge
  # Keep differential packaging (blockmap) for small auto-updates.
  differentialPackage: true

linux:
  target: [AppImage]
  category: Utility
  icon: build/icon.png

publish:
  provider: github
  owner: mp-salesgent
  repo: pax-bridge
  releaseType: release
