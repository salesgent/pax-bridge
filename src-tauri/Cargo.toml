[package]
name = "pax_bridge_desktop"
version = "1.0.5"
description = "Salesgent Hardware Bridge"
edition = "2021"
license = "UNLICENSED"
default-run = "pax-bridge-desktop"

[lib]
name = "pax_bridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "pax-bridge-desktop"
path = "src/main.rs"

[[bin]]
name = "pax-bridge-server"
path = "src/bin/pax_bridge_server.rs"
required-features = ["bridge-server"]

[features]
default = []
# Headless HTTP/WS binary for local API tests — not shipped in the .app bundle.
bridge-server = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Minimal Tauri surface — no dialog/shell/process plugins (those alone add MBs).
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# In-app updates. rustls (not native-tls) keeps the size cost down.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }

# --- PAX bridge ---
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "signal"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
serialport = { version = "4", default-features = false }
dotenvy = "0.15"
uuid = { version = "1", default-features = false, features = ["v4", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "1"
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
bytes = { version = "1", default-features = false }
anyhow = { version = "1", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
