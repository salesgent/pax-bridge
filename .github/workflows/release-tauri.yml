name: Release (Tauri)

# Builds macOS DMG (arm64 + x64) and Windows NSIS via tauri-action.
# Tag push (v*) → build + publish. Manual run → artifacts only unless publish=true.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload artifacts to GitHub Releases"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            # `app` produces the .app.tar.gz the updater consumes; `dmg` is the download.
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            args: --bundles nsis
            rust_target: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      # Prefer App Store Connect API key notarization (same secrets as Electron releases).
      # Do NOT export empty APPLE_ID / APPLE_TEAM_ID — Tauri treats "" as set and then
      # fails with "Team ID must be at least 3 characters".
      - name: Configure Apple signing + notarization
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_API_KEY_SECRET:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
            KEY_DIR="${RUNNER_TEMP}/private_keys"
            mkdir -p "$KEY_DIR"
            KEY_PATH="${KEY_DIR}/AuthKey_${APPLE_API_KEY_ID}.p8"
            case "$APPLE_API_KEY_SECRET" in
              *BEGIN*PRIVATE\ KEY*)
                printf '%s\n' "$APPLE_API_KEY_SECRET" > "$KEY_PATH"
                ;;
              *)
                if ! printf '%s' "$APPLE_API_KEY_SECRET" | base64 --decode > "$KEY_PATH" 2>/dev/null; then
                  printf '%s\n' "$APPLE_API_KEY_SECRET" > "$KEY_PATH"
                fi
                ;;
            esac
            if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"; then
              echo "::error::APPLE_API_KEY secret is not a valid .p8 private key (expected PEM or base64-encoded PEM)"
              exit 1
            fi
            chmod 600 "$KEY_PATH"
            {
              echo "APPLE_API_KEY=${APPLE_API_KEY_ID}"
              echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
              echo "APPLE_API_KEY_PATH=${KEY_PATH}"
            } >> "$GITHUB_ENV"
            echo "Notarization auth: App Store Connect API key (${APPLE_API_KEY_ID})"
          elif [ -n "${APPLE_ID_SECRET:-}" ] && [ -n "${APPLE_PASSWORD_SECRET:-}" ] && [ -n "${APPLE_TEAM_ID_SECRET:-}" ]; then
            {
              echo "APPLE_ID=${APPLE_ID_SECRET}"
              echo "APPLE_PASSWORD=${APPLE_PASSWORD_SECRET}"
              echo "APPLE_TEAM_ID=${APPLE_TEAM_ID_SECRET}"
            } >> "$GITHUB_ENV"
            echo "Notarization auth: Apple ID + team ${APPLE_TEAM_ID_SECRET}"
          else
            echo "::error::Missing Apple notarization secrets. Set APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER (preferred) or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID"
            exit 1
          fi

      - name: Build only (no publish)
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.publish == true) }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: .
          args: ${{ matrix.args }}

      - name: Build and publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish == true }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE || secrets.CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_API_* / APPLE_ID* come from GITHUB_ENV (macOS configure step only)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.ref_name }}
          releaseName: "Salesgent Hardware Bridge ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # tauri-action@v0 has no asset-rename input, so the CLI names still carry
          # the version. The `release-notes` job renames them to fixed names after
          # upload — that is what keeps the ERP download URLs constant.
          args: ${{ matrix.args }}

      - name: Upload artifacts
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.publish == true) }}
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}-${{ matrix.rust_target || 'native' }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn
          retention-days: 7

  release-notes:
    # Renames the uploaded assets to version-less names and writes the download
    # table. Keep the names in sync with:
    #   erp-frontend/src/modules/shared/paymentTerminal/bridgeDownload.js
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      MAC_ARM: Salesgent-Pax-Bridge-macOS-Apple-Silicon.dmg
      MAC_INTEL: Salesgent-Pax-Bridge-macOS-Intel.dmg
      WINDOWS: Salesgent-Pax-Bridge-Windows-Setup.exe
      LOGO: Salesgent-Pax-Bridge-Logo.png
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the release to exist
        run: |
          for _ in $(seq 1 20); do
            gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 && exit 0
            sleep 6
          done
          echo "::error::Release $TAG not found"
          exit 1

      - name: Rename assets to fixed, version-less names
        run: |
          set -euo pipefail
          # NOTE: if the updater is ever enabled (TAURI_SIGNING_PRIVATE_KEY set),
          # latest.json is generated with the pre-rename URLs and must be patched too.
          rename() { # $1 = current asset name, $2 = target name
            if [ "$1" = "$2" ]; then return 0; fi
            ID=$(gh api "repos/$REPO/releases/tags/$TAG" \
                  --jq ".assets[] | select(.name == \"$1\") | .id")
            if [ -z "$ID" ]; then return 0; fi
            echo "Renaming $1 -> $2"
            gh api --method PATCH "repos/$REPO/releases/assets/$ID" \
              -f name="$2" -f label="$2" >/dev/null
          }

          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[].name' > assets.txt
          cat assets.txt

          while read -r NAME; do
            case "$NAME" in
              *aarch64*.dmg)  rename "$NAME" "$MAC_ARM" ;;
              *x64*.dmg)      rename "$NAME" "$MAC_INTEL" ;;
              *setup.exe)     rename "$NAME" "$WINDOWS" ;;
            esac
          done < assets.txt

          echo "Final assets:"
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[].name'

      - name: Point latest.json at the renamed assets
        run: |
          set -euo pipefail
          # tauri-action writes latest.json with the CLI's original asset names,
          # but the rename step above changed the Windows installer's name — so
          # the updater URL 404s unless we rewrite it here. The macOS
          # .app.tar.gz assets are not renamed, so their URLs stay valid.
          if ! gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' | grep -qx 'latest.json'; then
            echo "No latest.json in this release (updater disabled) — nothing to patch."
            exit 0
          fi
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --output latest.json --clobber
          python3 - "https://github.com/$REPO/releases/download/$TAG/$WINDOWS" <<'PY'
          import json, sys
          win_url = sys.argv[1]
          m = json.load(open('latest.json'))
          for key, val in m.get('platforms', {}).items():
              if key.startswith('windows-'):
                  val['url'] = win_url
          json.dump(m, open('latest.json', 'w'), indent=2)
          PY
          cat latest.json
          gh release upload "$TAG" --repo "$REPO" --clobber latest.json

      - name: Upload the logo to the release
        run: |
          set -euo pipefail
          # gh release upload keeps the local filename as the asset name, so
          # copy to the name we want the download URL to have.
          cp src/renderer/logo.png "$LOGO"
          gh release upload "$TAG" --repo "$REPO" --clobber "$LOGO"

      - name: Write the download guide
        run: |
          set -euo pipefail
          # /releases/latest/download/<file> always resolves to the newest release,
          # so these URLs never change and the ERP never needs a version bump.
          BASE="https://github.com/$REPO/releases/latest/download"
          # Pinned to this exact release (not /latest/) so the notes always show
          # the logo that shipped with this version, even after newer releases.
          LOGO_URL="https://github.com/$REPO/releases/download/$TAG/$LOGO"
          {
            echo "<img src=\"$LOGO_URL\" alt=\"Salesgent Hardware Bridge\" width=\"96\" />"
            echo
            echo '## Download the right file for your computer'
            echo
            echo '| Your computer | Download | How to know it is you |'
            echo '|---|---|---|'
            echo "| **Mac — Apple Silicon** (M1/M2/M3/M4) | [$MAC_ARM]($BASE/$MAC_ARM) | Apple menu → About This Mac shows a *Chip* like \"Apple M2\" |"
            echo "| **Mac — Intel** | [$MAC_INTEL]($BASE/$MAC_INTEL) | Apple menu → About This Mac shows a *Processor* like \"Intel Core i5\" |"
            echo "| **Windows** (64-bit) | [$WINDOWS]($BASE/$WINDOWS) | Any Windows 10 or 11 PC |"
            echo
            echo 'Ignore the "Source code (zip / tar.gz)" files — those are not the app.'
            echo
            echo "Not sure which Mac you have? The Apple Silicon build is the right"
            echo 'answer for any Mac bought from late 2020 onward.'
            echo
            echo '### For developers'
            echo
            echo "File names never include the version, and \`/releases/latest/download/...\`"
            echo 'always points at the newest release — so links embedded in the ERP stay valid'
            echo 'forever and need no update when a new version ships.'
          } > notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
